<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Warden — the warden between your agents and your database">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1512"/>
      <stop offset="0.55" stop-color="#0F2C25"/>
      <stop offset="1" stop-color="#123F34"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4FC49E"/>
      <stop offset="1" stop-color="#1F6F5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3BA88A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3BA88A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="250" cy="200" r="240" fill="url(#glow)"/>

  <!-- shield -->
  <g transform="translate(140 96)">
    <path d="M114 0 4 40v76c0 62 44 118 110 138 66-20 110-76 110-138V40L114 0Z" fill="url(#shield)"/>
    <path d="M114 44 44 70v48c0 39 28 74 70 87 42-13 70-48 70-87V70l-70-26Z" fill="#0A1512" opacity="0.88"/>
    <path d="M86 122l22 23 46-49" stroke="#4FC49E" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- wordmark -->
  <text x="440" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="112" font-weight="680" fill="#F2F7F5" letter-spacing="-2">Warden</text>
  <text x="446" y="252" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="450" fill="#8FBFAF" letter-spacing="0.2">The warden between your agents and your database.</text>

  <g transform="translate(446 296)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5E9384">
    <rect x="-10" y="-26" width="612" height="52" rx="10" fill="#0A1512" opacity="0.55"/>
    <text x="8" y="8"><tspan fill="#4FC49E">agent</tspan> ──▶ <tspan fill="#F2F7F5">warden</tspan> ──▶ <tspan fill="#8FBFAF">database</tspan></text>
  </g>
</svg>
